<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle da EBD</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f6f2;
            color: #3d2f24;
        }

        header {
            padding: 30px;
            text-align: center;
            background: #ffffff;
            border-bottom: 2px solid #d6c2ad;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            color: #9ca3af;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .domingo h2 {
            margin-top: 0;
        }

        .classes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .classe {
            background: #f7f3ee;
            border: 1px solid #d6b38a;
            border-radius: 12px;
            padding: 25px;
            transition: 0.2s;
        }

        .classe:hover {
            transform: translateY(-3px);
            border-color: #faf4f0;
        }

        .classe h3 {
            margin-top: 0;
            color: #6b4f35;
        }

        .classe p {
            color: #8a7a68;
        }

        .dados-classe {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 15px 0;
            padding: 12px;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #e2d5c5;
        }

        .dados-classe span {
            font-size: 14px;
            color: #5f5145;
        }

        .botoes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .botao {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            background: #c8ad8d;
            color: #4e342e;
            border:1px solid #b08968;
            font-weight: normal;
        }

        .botao:hover {
            background: #b08968;
            color:white;        
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            background: #374151;
            color: white;
        }

        button:hover {
            background: #4b5563;
        }

        .resumo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .card {
            background: #c8ad8d;
            color:#4e342e;
            border:1px solid #b08968;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .card strong {
            display: block;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .menu-trimestres{
            display:flex;
            flex-direction:column;
            gap:8px;
            width:90px; 
            margin:15px 0 20px 0;
        }

        .tri-btn{
            text-decoration:none;
            text-align:center;
            background:#ead7bc;
            color:#5b4331;
            padding:8px;
            border-radius:8px;
            font-size:13px;
            font-weight:600;
            border:1px solid #d8c3a5;
        }

        .tri-btn:hover{
            background:#f5f1ea;
            color:#5b4331;
            border-color:#d8c3a5;
        }

        .tri-ativo {
            background: #b08968;
            color: white;
            border-color: #8f6d4e;
        }

/* =========================================================
   NAVEGAÇÃO GERAL
   ========================================================= */

.navegacao {
    width: min(760px, 92%);
    margin: 55px auto 0;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;

    padding: 24px;

    background: rgba(255, 253, 248, 0.92);
    border: 1px solid #e2d5c5;
    border-radius: 22px;

    box-shadow:
        0 12px 30px rgba(80, 55, 35, 0.10),
        0 3px 8px rgba(80, 55, 35, 0.06);

    backdrop-filter: blur(4px);
}

.nav-btn {
    min-height: 95px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    text-decoration: none;

    background:
        linear-gradient(
            180deg,
            #ead7bc,
            #dcc09b
        );

    color: #5b4331;

    border: 1px solid #c9a77d;
    border-radius: 16px;

    font-size: 15px;
    font-weight: 700;

    box-shadow:
        0 6px 12px rgba(80, 55, 35, 0.10);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}

.nav-btn:hover {
    transform: translateY(-4px);

    background:
        linear-gradient(
            180deg,
            #f0dfc8,
            #d9b98f
        );

    border-color: #b08968;

    box-shadow:
        0 12px 22px rgba(80, 55, 35, 0.16);
}

@media (max-width: 700px) {
    .navegacao {
        grid-template-columns: repeat(2, 1fr);
        width: 94%;
        padding: 18px;
        gap: 14px;
        margin-top: 35px;
    }
}



/* =========================================================
   ANIMAÇÃO DOS PAINÉIS PRINCIPAIS
   ========================================================= */

.navegacao {
    border-bottom: none !important;
    border-top: none !important;
    animation: painelEntrada 0.8s ease-out both;
}

.nav-btn {
    position: relative;
    overflow: hidden;

    animation: blocoEntrada 0.7s ease-out both,
               flutuar 4s ease-in-out infinite;

    transform: translateY(0);

    will-change: transform, box-shadow;
}

/* Entrada sequencial dos seis blocos */
.nav-btn:nth-child(1) {
    animation-delay: 0s, 0.2s;
}

.nav-btn:nth-child(2) {
    animation-delay: 0.08s, 0.5s;
}

.nav-btn:nth-child(3) {
    animation-delay: 0.16s, 0.8s;
}

.nav-btn:nth-child(4) {
    animation-delay: 0.24s, 1.1s;
}

.nav-btn:nth-child(5) {
    animation-delay: 0.32s, 1.4s;
}

.nav-btn:nth-child(6) {
    animation-delay: 0.40s, 1.7s;
}

/* Brilho suave passando pelo botão */
.nav-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;

    width: 70%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.30),
        transparent
    );

    transform: skewX(-20deg);
    transition: left 0.6s ease;
}

.nav-btn:hover::before {
    left: 140%;
}

/* Hover */
.nav-btn:hover {
    transform: translateY(-8px) scale(1.025);

    box-shadow:
        0 16px 28px rgba(80, 55, 35, 0.18),
        0 4px 8px rgba(80, 55, 35, 0.10);

    background:
        linear-gradient(
            180deg,
            #f3dfc3,
            #d8b487
        );
}

/* Clique */
.nav-btn:active {
    transform: translateY(-2px) scale(0.98);

    box-shadow:
        0 5px 10px rgba(80, 55, 35, 0.12);
}

/* =========================================================
   ANIMAÇÕES
   ========================================================= */

@keyframes painelEntrada {
    from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes blocoEntrada {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.92);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes flutuar {
    0%, 100% {
        margin-top: 0;
    }

    50% {
        margin-top: -5px;
    }
}

/* =========================================================
   REMOVE LINHAS HORIZONTAIS
   ========================================================= */

header {
    border-bottom: none !important;
}

main {
    border: none !important;
}

.container {
    border: none !important;
}

.navegacao {
    border-bottom: none !important;
}

/* =========================================================
   REDUZ ANIMAÇÕES SE O SISTEMA DO USUÁRIO PEDIR
   ========================================================= */

@media (prefers-reduced-motion: reduce) {
    .nav-btn,
    .navegacao {
        animation: none !important;
    }

    .nav-btn {
        transition: none !important;
    }
}

/* Entrada em sequência */

.nav-btn:nth-child(3) {

}

.nav-btn:nth-child(5) {

}

.nav-btn:nth-child(6) {

}


/* Hover */
.nav-btn:hover {
    transform: translateY(-8px) scale(1.035);

    background:
        linear-gradient(

            #fff1dc,

}


/* Clique */

}


/* =========================================================
